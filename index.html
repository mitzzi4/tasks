<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Tasks</h1>
      <div class="date" id="todayLabel"></div>
    </div>
    <div id="syncState"><span class="dot"></span><span id="syncLabel">Подключение…</span></div>
  </header>

  <div class="overview">
    <div class="stats">
      <div class="stat"><div class="n" id="statActive">0</div><div class="lbl">Активных</div></div>
      <div class="stat overdue"><div class="n" id="statOverdue">0</div><div class="lbl">Просрочено</div></div>
      <div class="stat"><div class="n" id="statDone">0</div><div class="lbl">Выполнено</div></div>
    </div>

    <div class="week-block">
      <div class="week-head">
        <button type="button" class="wk-arrow" id="weekPrev" aria-label="Предыдущая неделя">‹</button>
        <div class="week-label" id="weekLabel"></div>
        <div class="week-nav-right">
          <button type="button" class="week-today" id="weekToday">Сегодня</button>
          <button type="button" class="wk-arrow" id="weekNext" aria-label="Следующая неделя">›</button>
        </div>
      </div>
      <div class="week-strip" id="weekStrip"></div>
    </div>
  </div>

  <div class="list-head">
    <div class="list-title" id="listTitle"></div>
    <button type="button" class="detailsToggle" id="clearDayBtn" hidden>Все дела ×</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="Поиск…">
    <select id="tagFilter"><option value="">Все теги</option></select>
    <select id="sortSelect">
      <option value="smart">По умолчанию</option>
      <option value="due">По сроку</option>
      <option value="priority">По приоритету</option>
      <option value="created">По дате добавления</option>
    </select>
    <label><input type="checkbox" id="showDone"> Выполненные</label>
  </div>

  <div id="list"></div>
  <div class="hint" id="seedHint" hidden>Это примеры — отредактируйте их или удалите и добавьте свои дела.</div>
</div>

<button type="button" class="fab" id="fabAdd" aria-label="Новое дело">+</button>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
    <div class="modal-head">
      <h2 id="modalHeading">Новое дело</h2>
      <button type="button" class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
    </div>
    <form id="addForm">
      <div class="modal-body">
        <input id="titleInput" type="text" placeholder="Название дела" maxlength="200" required>
        <div class="drow">
          <input id="dueInput" type="date">
          <select id="prioInput">
            <option value="low">Низкий приоритет</option>
            <option value="medium" selected>Средний приоритет</option>
            <option value="high">Высокий приоритет</option>
          </select>
        </div>
        <input id="tagsInput" type="text" placeholder="Теги через запятую">
        <textarea id="descInput" placeholder="Заметка (необязательно)"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="modalCancel">Отмена</button>
        <button type="submit" class="primary">Добавить</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="editOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
    <div class="modal-head">
      <h2 id="editHeading">Дело</h2>
      <button type="button" class="modal-close" id="editClose" aria-label="Закрыть">×</button>
    </div>
    <form id="editForm">
      <div class="modal-body">
        <input id="editTitle" type="text" placeholder="Название дела" maxlength="200" required>
        <div class="drow">
          <input id="editDue" type="date">
          <select id="editPrio">
            <option value="low">Низкий приоритет</option>
            <option value="medium">Средний приоритет</option>
            <option value="high">Высокий приоритет</option>
          </select>
        </div>
        <input id="editTags" type="text" placeholder="Теги через запятую">
        <textarea id="editDesc" placeholder="Заметка (необязательно)"></textarea>
      </div>
      <div class="modal-actions between">
        <button type="button" class="link" id="editDelete">Удалить</button>
        <div class="right">
          <button type="button" class="ghost" id="editCancel">Отмена</button>
          <button type="submit" class="primary">Сохранить</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
